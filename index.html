return `<h1>Карточки</h1><div class="hero">${mascot()}<div class="mut">К проверке${V.deck?' · тема '+V.deck:''}</div><div class="big">${nd}</div><div class="mut" style="margin-top:6px">всего ${L.length}</div><div style="margin-top:16px;display:flex;gap:10px"><button class="btn w" ${nd?'':'disabled'} onclick="fcStart()">Проверить</button><button class="btn" style="background:rgba(255,255,255,.2);box-shadow:none" onclick="addCard()">+ Карточка</button></div></div><div style="display:flex;gap:8px;overflow:auto;margin-bottom:12px"><button class="chip ${V.deck?'':'c1'}" onclick="go('c')">Все</button>${TH.map(t=>`<button class="chip ${V.deck==t[0]?'c1':''}" style="border:0" onclick="go('c',{deck:'${t[0]}'})">${t[0]}. ${esc(t[1].split(' ')[0])}</button>`).join('')}</div>`+L.map(c=>`<div class="card row" style="cursor:default"><div><b>${esc(c.f)}</b><div class="mut">${esc(c.b)}</div></div><span class="chip c${cpr(c.id).box>2?3:cpr(c.id).box?1:0}">ур. ${cpr(c.id).box}</span></div>`).join('')}
// ---- Прогресс
function vProg(){const A=S.att,avg=A.length?Math.round(A.reduce((a,t)=>a+t.c/t.n,0)/A.length*100):null;
return `<h1>Прогресс</h1><div class="grid" style="margin-top:14px"><div class="card"><div class="mut">XP · уровень ${Math.floor(S.xp/100)+1}</div><div style="font-size:34px;font-weight:800">${S.xp}</div></div><div class="card"><div class="mut">Серия дней</div><div style="font-size:34px;font-weight:800">${streak()}</div></div><div class="card"><div class="mut">Тестов пройдено</div><div style="font-size:34px;font-weight:800">${A.length}</div></div><div class="card"><div class="mut">Средний результат</div><div style="font-size:34px;font-weight:800">${avg==null?'—':avg+'%'}</div></div></div><h2>Точность по разделам</h2>`+TH.map(t=>{let a=0,c=0;t[3].forEach(s=>{const x=S.st[s[0]];if(x){a+=x.a;c+=x.c}});return `<div class="card"><div class="row" style="cursor:default"><b>${esc(t[1])}</b><span class="mut">${a?Math.round(c/a*100)+'% · '+a+' отв.':'нет данных'}</span></div><div class="bar" style="margin-top:10px"><i style="width:${a?c/a*100:0}%"></i></div></div>`}).join('')+`<h2>Данные</h2><div class="grid"><button class="btn g" onclick="setEv()">Дата этапа</button><button class="btn g" onclick="form('Экспорт',[{k:'t',l:'Копия данных',t:'area'}],()=>{});$('#ft').value=JSON.stringify(S)">Экспорт</button><button class="btn g" onclick="form('Импорт',[{k:'t',l:'Вставьте копию',t:'area'}],r=>{try{S=Object.assign({},D,JSON.parse(r.t))}catch(e){alert('Неверный формат');return false}})">Импорт</button><button class="btn g" style="color:var(--er)" onclick="if(confirm('Удалить весь прогресс?')){S={...D};save();render()}">Сбросить</button></div><div class="mut" style="margin:14px 2px">Данные хранятся на этом устройстве. Индекс готовности и аналитика по неделям пока не реализованы.</div>`}
function render(){$('#nav').innerHTML=[['h','Главная','M3 11l9-8 9 8v9H3z'],['t','Темы','M4 6h16M4 12h16M4 18h10'],['q','Тесты','M5 12l5 5L20 7'],['c','Карточки','M4 8h12v10H4zM8 5h12v10'],['p','Прогресс','M4 20V10M10 20V4M16 20v-7M22 20H2']].map(x=>`<button class="${V.t==x[0]?'on':''}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24"><path d="${x[2]}"/></svg>${x[1]}</button>`).join('');
$('#app').innerHTML={h:vHome,t:vTopics,q:vTests,c:vCards,p:vProg}[V.t]();tick()}
